<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Next Upload Settings</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          sans-serif;
        margin: 24px;
        color: #111;
      }
      .card {
        max-width: 640px;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 18px 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      label {
        display: flex;
        gap: 10px;
        align-items: center;
        user-select: none;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
      }
      .hint {
        margin-top: 10px;
        color: #444;
        font-size: 13px;
      }
      .status {
        margin-top: 12px;
        font-size: 13px;
        color: #0a5;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Settings</h1>
      <label>
        <input id="openInNewTab" type="checkbox" />
        Open next upload in a new tab
      </label>
      <div class="hint">
        When unchecked, the Next upload button navigates in the current tab.
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
